<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://ddragon.leagueoflegends.com"
    />
    <title>Itachio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="rail-brand"><img class="seal" src="logo.png" alt="" aria-hidden="true" /><span>Itachio</span><small class="ver" id="railver"></small></div>
        <div class="nav-caption">WORKSPACE</div>
        <nav class="tabs" id="tabs" aria-label="Workspace sections" hidden>
          <button data-tab="draft" class="active"><span class="nav-mark live-mark"></span>Draft</button>
          <button data-tab="champions"><span class="nav-mark champion-mark"></span>Champions</button>
          <button data-tab="team"><span class="nav-mark team-mark"></span>Team</button>
          <button data-tab="history"><span class="nav-mark history-mark"></span>History</button>
        </nav>
        <div class="rail-spacer"></div>
        <div class="rail-player" id="rail-player"></div>
        <button class="rail-settings" id="optbtn" title="Options">
          <span class="settings-mark" aria-hidden="true">⚙</span><span>Options</span>
        </button>
      </aside>
      <section class="workspace">
        <header class="topbar">
          <div class="brand auth-brand"><img class="seal" src="logo.png" alt="" aria-hidden="true" />Itachio<small class="ver" id="ver"></small></div>
          <div class="page-head" id="page-head" hidden>
            <span class="page-kicker" id="page-kicker"></span>
            <h1 id="page-title"></h1>
          </div>
          <div class="top-right">
            <div class="source-warning" id="metasrc-warning" role="status" hidden></div>
            <div class="status" id="status"></div>
            <button class="update-btn" id="upbtn" hidden>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a.75.75 0 0 1 .75.75v6.69l2.22-2.22a.75.75 0 1 1 1.06 1.06l-3.5 3.5a.75.75 0 0 1-1.06 0l-3.5-3.5a.75.75 0 1 1 1.06-1.06l2.22 2.22V2.25A.75.75 0 0 1 8 1.5ZM2.75 12.5a.75.75 0 0 0 0 1.5h10.5a.75.75 0 0 0 0-1.5H2.75Z"/></svg>
              Update
            </button>
          </div>
        </header>
        <main id="view"></main>
      </section>
    </div>
    <div id="update" aria-live="polite"></div>
    <div id="modal"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script src="recommend.js"></script>
    <script src="model.js"></script>
    <script src="app.js"></script>
  </body>
</html>
