<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://ddragon.leagueoflegends.com"
    />
    <title>Itachio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img class="seal" src="logo.png" alt="" aria-hidden="true" />Itachio<small class="ver" id="ver"></small></div>
      <nav class="tabs" id="tabs" hidden>
        <button data-tab="draft" class="active">Draft</button>
        <button data-tab="champions">Champions</button>
        <button data-tab="team">Team</button>
        <button data-tab="history">History</button>
      </nav>
      <div class="top-right">
      <div class="status" id="status"></div>
      <button class="update-btn" id="upbtn" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a.75.75 0 0 1 .75.75v6.69l2.22-2.22a.75.75 0 1 1 1.06 1.06l-3.5 3.5a.75.75 0 0 1-1.06 0l-3.5-3.5a.75.75 0 1 1 1.06-1.06l2.22 2.22V2.25A.75.75 0 0 1 8 1.5ZM2.75 12.5a.75.75 0 0 0 0 1.5h10.5a.75.75 0 0 0 0-1.5H2.75Z"/></svg>
        Update
      </button>
      <button class="opt-btn" id="optbtn" title="Options" aria-label="Options">
        <!-- Mitsudomoe: three tomoe turning around the center -->
        <svg viewBox="-12 -12 24 24" aria-hidden="true">
          <defs><path id="tomoe" d="M0-8.2A8.2 8.2 0 0 1 7.9-2.2Q4.4-2.6 0-2.4A2.9 2.9 0 0 1 0-8.2z"/></defs>
          <circle r="11" class="tomoe-ring"/>
          <use href="#tomoe"/><use href="#tomoe" transform="rotate(120)"/><use href="#tomoe" transform="rotate(240)"/>
        </svg>
      </button>
      </div>
    </header>
    <main id="view"></main>
    <div id="update" aria-live="polite"></div>
    <div id="modal"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script src="recommend.js"></script>
    <script src="model.js"></script>
    <script src="app.js"></script>
  </body>
</html>
