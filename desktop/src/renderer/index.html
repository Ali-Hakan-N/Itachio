<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://ddragon.leagueoflegends.com"
    />
    <title>Itachio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img class="seal" src="logo.png" alt="" aria-hidden="true" />Itachio<small class="ver" id="ver"></small></div>
      <nav class="tabs" id="tabs" hidden>
        <button data-tab="draft" class="active">Draft</button>
        <button data-tab="champions">Champions</button>

        <button data-tab="history">History</button>
      </nav>
      <div class="top-right">
      <div class="status" id="status"></div>
      <button class="update-btn" id="upbtn" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a.75.75 0 0 1 .75.75v6.69l2.22-2.22a.75.75 0 1 1 1.06 1.06l-3.5 3.5a.75.75 0 0 1-1.06 0l-3.5-3.5a.75.75 0 1 1 1.06-1.06l2.22 2.22V2.25A.75.75 0 0 1 8 1.5ZM2.75 12.5a.75.75 0 0 0 0 1.5h10.5a.75.75 0 0 0 0-1.5H2.75Z"/></svg>
        Update

      <button class="icon-btn" id="optbtn" title="Options" aria-label="Options">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 1 1.04.07l.33 1.83c.46.13.9.32 1.3.55l1.53-1.06c.55.4 1.03.88 1.43 1.43l-1.06 1.53c.23.4.42.84.55 1.3l1.83.33a8 8 0 0 1 0 2.08l-1.83.33c-.13.46-.32.9-.55 1.3l1.06 1.53c-.4.55-.88 1.03-1.43 1.43l-1.53-1.06c-.4.23-.84.42-1.3.55l-.33 1.83a8 8 0 0 1-2.08 0l-.33-1.83a5.5 5.5 0 0 1-1.3-.55l-1.53 1.06a8 8 0 0 1-1.43-1.43l1.06-1.53a5.5 5.5 0 0 1-.55-1.3L.07 9.04a8 8 0 0 1 0-2.08l1.83-.33c.13-.46.32-.9.55-1.3L1.39 3.8c.4-.55.88-1.03 1.43-1.43l1.53 1.06c.4-.23.84-.42 1.3-.55L5.98.07A8 8 0 0 1 8 0Zm0 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
      </button>
      </div>
    </header>
    <main id="view"></main>
    <div id="update" aria-live="polite"></div>
    <div id="modal"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script src="recommend.js"></script>
    <script src="model.js"></script>
    <script src="app.js"></script>

</html>
