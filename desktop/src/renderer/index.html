<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://ddragon.leagueoflegends.com"
    />
    <title>Flex Drafter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true"></span>Flex<span>Drafter</span></div>
      <nav class="tabs" id="tabs" hidden>
        <button data-tab="draft" class="active">Draft</button>
        <button data-tab="pool" class="locked" disabled title="Coming soon">
          <svg class="lock" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2h.5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h.5Zm1.5 0h4V5a2 2 0 1 0-4 0v2Z"/></svg>My pool
        </button>
        <button data-tab="team">Team</button>
        <button data-tab="history">History</button>
      </nav>
      <div class="status" id="status"></div>
    </header>
    <main id="view"></main>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script src="recommend.js"></script>
    <script src="app.js"></script>
  </body>
</html>
